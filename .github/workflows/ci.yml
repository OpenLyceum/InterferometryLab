name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Caller must grant the scopes the reusable workflows request (CodeQL needs
# security-events: write, dependency-review needs pull-requests: write). The repo
# default token is read-only, so without this block reusable calls fail at startup.
permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

jobs:
  ci:
    uses: OpenLyceum/Baton/.github/workflows/ci.yml@main
    with:
      run-architecture: true

  compliance:
    uses: OpenLyceum/Baton/.github/workflows/shared-compliance-check.yml@main

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: OpenLyceum/Baton/.github/workflows/shared-dependency-review.yml@main

  codeql:
    uses: OpenLyceum/Baton/.github/workflows/shared-codeql.yml@main
